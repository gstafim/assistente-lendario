<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>O Assistente Lendário</title>
<style>
  :root {
    --ink: #1d1b2f;
    --muted: #5b5875;
    --pink: #ff3d7f;
    --yellow: #ffd23f;
    --green: #22c55e;
    --blue: #3b82f6;
    --orange: #ff8c42;
    --purple: #8b5cf6;
    --red: #ef4444;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
    background: radial-gradient(circle at 15% 0%, #4a2591 0%, transparent 45%),
                radial-gradient(circle at 90% 100%, #8a2a5c 0%, transparent 45%),
                #140e33;
    color: #fff;
    min-height: 100vh;
    padding: 12px 16px 24px;
    overflow-x: hidden;
  }
  .wrap { width: 100%; max-width: 1340px; margin: 0 auto; display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); }
  @media (min-width: 1200px) {
    .wrap { grid-template-columns: minmax(0, 1fr) 340px; align-items: start; }
    .card { position: sticky; top: 12px; max-height: calc(100vh - 24px); overflow-y: auto; }
  }
  .left { width: 100%; max-width: min(960px, calc((100vh - 90px) * 16 / 9)); margin: 0 auto; min-width: 280px; }

  .hud { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; font-weight: bold; }
  .pill { background: rgba(255,255,255,.12); border: 2px solid rgba(255,255,255,.22); padding: 6px 14px; border-radius: 999px; display: flex; align-items: center; gap: 8px; }
  .hearts span { display: inline-block; transition: transform .3s, opacity .3s; }
  .hearts span.lost { opacity: .25; filter: grayscale(1); transform: scale(.8); }
  .prog { flex: 1; min-width: 160px; }
  .prog .bar { flex: 1; height: 10px; background: rgba(255,255,255,.18); border-radius: 999px; overflow: hidden; min-width: 60px; }
  .prog .bar div { height: 100%; width: 0; background: linear-gradient(90deg, var(--green), #a3e635); transition: width .4s; }
  .prog.boss .bar div { background: linear-gradient(90deg, var(--red), var(--orange)); }
  .score-pop { animation: pop .35s; }
  @keyframes pop { 50% { transform: scale(1.3); color: var(--yellow); } }
  @media (max-width: 560px) {
    .hud { flex-wrap: nowrap; font-size: .82rem; gap: 6px; }
    .pill { padding: 4px 9px; gap: 5px; }
    .prog { min-width: 0; }
    .prog .bar { min-width: 24px; }
    #progText { white-space: nowrap; }
  }
  .mute { cursor: pointer; color: #fff; font-size: 1.1rem; font-family: inherit; }

  .stage { position: relative; }
  #cv { width: 100%; aspect-ratio: 16 / 9; display: block; border-radius: 16px; box-shadow: 0 16px 50px rgba(0,0,0,.45); background: #1e1450; }

  .touch { display: none; justify-content: space-between; margin-top: 10px; gap: 10px; user-select: none; -webkit-user-select: none; }
  .touch div { display: flex; gap: 10px; }
  .touch button {
    font: bold 1.5rem inherit; font-family: inherit; color: #fff; border: none; border-radius: 16px;
    background: rgba(255,255,255,.18); width: 72px; height: 64px; touch-action: none;
  }
  .touch button.jump { width: 120px; background: linear-gradient(135deg, var(--pink), var(--orange)); font-size: 1.1rem; }
  .touch button.on { transform: scale(.94); background: rgba(255,255,255,.35); }
  @media (hover: none) and (pointer: coarse) { .touch { display: flex; } }

  .card { background: #fff; color: var(--ink); border-radius: 18px; padding: 18px; box-shadow: 0 16px 50px rgba(0,0,0,.35); width: 100%; max-width: 960px; margin: 0 auto; }
  .card-title { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 8px; }
  .card-title h3 { color: var(--purple); font-size: 1.1rem; }
  .badge { background: var(--blue); color: #fff; padding: 4px 12px; border-radius: 999px; font-size: .8rem; font-weight: bold; white-space: nowrap; }
  .badge.boss { background: var(--red); }
  .q { font-weight: bold; font-size: 1.08rem; line-height: 1.4; margin-bottom: 10px; }
  .data { margin-bottom: 10px; overflow-x: auto; }
  .hint { font-size: .9rem; color: var(--muted); background: #f5f0ff; border-radius: 10px; padding: 8px 10px; line-height: 1.4; }
  .timer { height: 10px; background: #f1edf9; border-radius: 999px; overflow: hidden; margin: 4px 0 10px; }
  .timer div { height: 100%; background: linear-gradient(90deg, var(--yellow), var(--orange)); width: 100%; transition: width .25s linear; }
  .feed { margin-top: 10px; padding: 10px 12px; border-radius: 10px; font-size: .92rem; line-height: 1.45; animation: fin .3s ease-out; }
  .feed.ok { background: #e6f9ed; border: 2px solid var(--green); }
  .feed.bad { background: #fde8e8; border: 2px solid var(--red); }
  @keyframes fin { from { opacity: 0; transform: translateY(8px); } }
  .flash { animation: cardFlash .8s; }
  @keyframes cardFlash { 30% { box-shadow: 0 0 0 6px var(--yellow), 0 16px 50px rgba(0,0,0,.35); } }

  table.sheet { border-collapse: collapse; width: 100%; font-size: .9rem; }
  table.sheet th { background: #1f7a4a; color: #fff; padding: 5px 8px; text-align: left; }
  table.sheet td { border: 1px solid #cfe5d8; padding: 5px 8px; }
  table.sheet tr:nth-child(even) td { background: #f1faf4; }
  table.sheet .idx { background: #e7e7ef !important; color: #666; text-align: center; width: 30px; font-weight: bold; }
  .bars { display: flex; align-items: flex-end; gap: 10px; height: 120px; padding: 6px 6px 0; border-bottom: 3px solid #444; border-left: 3px solid #444; }
  .bars .b { flex: 1; height: 100%; display: flex; align-items: flex-end; }
  .bars .b div { width: 100%; border-radius: 6px 6px 0 0; color: #fff; font-weight: bold; text-align: center; font-size: .85rem; padding-top: 2px; }
  .bar-labels { display: flex; gap: 10px; padding: 4px 6px 0 9px; }
  .bar-labels span { flex: 1; text-align: center; font-weight: bold; font-size: .78rem; }
  .chart-title { font-weight: bold; color: var(--muted); margin-bottom: 4px; font-size: .85rem; }
  svg.line { width: 100%; height: auto; display: block; }

  .overlay { position: fixed; inset: 0; background: rgba(10, 6, 30, .72); backdrop-filter: blur(3px); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 30; }
  .overlay.hidden { display: none; }
  .modal { background: #fff; color: var(--ink); border-radius: 24px; padding: 22px 24px; max-width: 640px; width: 100%; overflow: hidden; text-align: center; animation: enter .4s ease-out; box-shadow: 0 20px 60px rgba(0,0,0,.5); }
  @keyframes enter { from { opacity: 0; transform: translateY(20px) scale(.96); } }
  .modal h1 { font-size: clamp(1.7rem, 5vw, 2.5rem); color: var(--purple); line-height: 1.1; }
  .modal .tag { display: block; font-size: .85rem; color: var(--pink); letter-spacing: .08em; text-transform: uppercase; margin-bottom: 6px; }
  .modal p { color: var(--muted); line-height: 1.5; margin: 10px 0; }
  .modal .big { font-size: 4rem; animation: float 2.5s ease-in-out infinite; }
  @keyframes float { 50% { transform: translateY(-8px); } }
  .story { background: #f5f0ff; border-left: 6px solid var(--purple); padding: 12px 16px; border-radius: 12px; text-align: left; margin: 14px 0; }
  .story p { color: var(--ink); margin: 4px 0; }
  .rules { display: grid; grid-template-columns: repeat(auto-fit, minmax(125px, 1fr)); gap: 8px; margin: 14px 0 18px; }
  .rule { background: #fff7e0; border: 2px solid #ffe7a3; border-radius: 12px; padding: 10px; font-size: .88rem; }
  .rule b { display: block; font-size: 1.4rem; margin-bottom: 2px; }
  kbd { background: #eee; border: 1px solid #ccc; border-bottom-width: 3px; border-radius: 6px; padding: 0 6px; font-family: inherit; font-weight: bold; }
  .btn {
    border: none; cursor: pointer; font-family: inherit; font-weight: bold; font-size: 1.2rem;
    padding: 15px 32px; border-radius: 16px; color: #fff;
    background: linear-gradient(135deg, var(--pink), var(--orange));
    box-shadow: 0 6px 0 #b8336a, 0 10px 20px rgba(0,0,0,.2);
    transition: transform .12s, box-shadow .12s; animation: pulse 1.6s infinite;
  }
  .btn:hover { transform: translateY(-3px) scale(1.03); }
  .btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #b8336a; }
  @keyframes pulse { 50% { box-shadow: 0 6px 0 #b8336a, 0 0 0 12px rgba(255,61,127,.15); } }
  .final { font-size: 2.4rem; font-weight: bold; color: var(--pink); margin: 6px 0; }
  .stats { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; margin: 10px 0 20px; }
  .stats div { background: #f5f0ff; padding: 8px 12px; border-radius: 10px; font-weight: bold; font-size: .9rem; }
  @media (max-height: 820px), (max-width: 560px) {
    .modal { padding: 16px 18px; border-radius: 18px; }
    .modal h1 { font-size: clamp(1.4rem, 4.5vw, 2rem); }
    .modal .big { font-size: 2.6rem; }
    .modal p { margin: 6px 0; font-size: .92rem; line-height: 1.4; }
    .story { padding: 8px 12px; margin: 8px 0; }
    .rules { margin: 8px 0 10px; gap: 6px; }
    .rule { padding: 6px; font-size: .8rem; }
    .rule b { font-size: 1.1rem; }
    .final { font-size: 1.9rem; }
    .stats { margin: 6px 0 12px; }
    .stats div { padding: 5px 9px; font-size: .8rem; }
    .btn { padding: 12px 26px; font-size: 1.05rem; }
  }
  .modes { display: flex; gap: 8px; justify-content: center; margin: 10px 0 6px; }
  .mode { font-family: inherit; font-weight: bold; font-size: 1rem; padding: 9px 16px; border-radius: 12px; border: 3px solid #e4d9ff; background: #f5f0ff; color: var(--ink); cursor: pointer; }
  .mode.on { border-color: var(--purple); background: var(--purple); color: #fff; }
  .mode:disabled { opacity: .4; cursor: not-allowed; }
  .pick { background: #faf8ff; border-radius: 14px; padding: 8px 10px; margin: 8px 0; text-align: left; }
  .pick-h { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 6px; }
  .ptag { color: #fff; font-weight: bold; border-radius: 999px; padding: 3px 10px; font-size: .85rem; white-space: nowrap; }
  .pick-h small { color: var(--muted); font-weight: bold; text-align: right; }
  .chars { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .char { font-family: inherit; font-weight: bold; font-size: .9rem; background: #fff; border: 3px solid #e9e4f5; border-radius: 12px; padding: 4px 2px 5px; cursor: pointer; display: flex; flex-direction: column; align-items: center; color: var(--ink); transition: transform .12s; }
  .char:hover { transform: translateY(-2px); }
  .char canvas { width: 48px; height: 56px; }
  .char.sel { border-color: var(--pc); background: #f5f0ff; box-shadow: 0 4px 0 var(--pc); }
  .char.taken { opacity: .45; }
  .btn2 { display: block; margin: 10px auto 0; background: none; border: none; color: var(--purple); font-family: inherit; font-weight: bold; font-size: .95rem; cursor: pointer; text-decoration: underline; }
  .keys-touch { display: none; }
  @media (hover: none) and (pointer: coarse) { .keys-desk { display: none; } .keys-touch { display: block; } }
  @media (max-height: 700px) { .modal .big { display: none; } }
  @media (max-height: 620px) {
    .modal { padding: 12px 14px; }
    .modal h1 { font-size: 1.3rem; }
    .modal p, .story p { font-size: .82rem; line-height: 1.35; }
    .story { margin: 6px 0; padding: 6px 10px; }
    .rules { margin: 6px 0 8px; gap: 5px; }
    .rule { font-size: .74rem; padding: 5px; }
    .rule b { font-size: .95rem; margin: 0; }
    .btn { padding: 10px 22px; }
  }
  @media (max-width: 560px) {
    .rules { grid-template-columns: 1fr 1fr; }
    .modal .tag { font-size: .72rem; }
  }
  #confetti { position: fixed; inset: 0; pointer-events: none; z-index: 40; }
  footer { color: rgba(255,255,255,.5); font-size: .8rem; margin-top: 14px; text-align: center; }
</style>
</head>
<body>

<div class="wrap">
  <div class="left">
    <div class="hud">
      <div class="pill hearts" id="hearts"></div>
      <div class="pill">⭐ <span id="score">0</span></div>
      <div class="pill prog" id="progPill"><span id="progText">Fase 1</span><div class="bar"><div id="progBar"></div></div></div>
      <button class="pill mute" id="muteBtn" title="Som">🔊</button>
    </div>
    <div class="stage"><canvas id="cv"></canvas></div>
    <div class="touch">
      <div><button data-k="left">◀</button><button data-k="right">▶</button></div>
      <button class="jump" data-k="jump">⤒ PULAR</button>
    </div>
  </div>

  <aside class="card" id="card">
    <div class="card-title"><h3 id="cTitle">Missão</h3><span class="badge" id="cBadge">Fase 1</span></div>
    <div class="q" id="cQ"></div>
    <div class="data" id="cData"></div>
    <div class="timer" id="cTimerWrap" hidden><div id="cTimer"></div></div>
    <div class="hint" id="cHint"></div>
    <div id="cFeed"></div>
  </aside>
</div>
<footer>Desafio Game Dev • TGDQ • Assistente Administrativo</footer>

<div class="overlay" id="overlay"><div class="modal" id="modal"></div></div>
<canvas id="confetti"></canvas>

<script>
/* =========================================================
   PERGUNTAS
   ========================================================= */
function sheet(headers, rows, withIndex) {
  let h = '<table class="sheet"><tr>' + (withIndex ? '<th class="idx"></th>' : '') +
          headers.map(x => '<th>' + x + '</th>').join('') + '</tr>';
  rows.forEach((r, i) => {
    h += '<tr>' + (withIndex ? '<td class="idx">' + (i + 2) + '</td>' : '') + r.map(c => '<td>' + c + '</td>').join('') + '</tr>';
  });
  return h + '</table>';
}
function bars(title, items) {
  const max = Math.max(...items.map(i => i.v));
  const colors = ['#3b82f6', '#8b5cf6', '#ff8c42', '#ff3d7f'];
  return '<div class="chart-title">' + title + '</div><div class="bars">' +
    items.map((it, i) => '<div class="b"><div style="height:' + (it.v / max * 100) + '%;background:' + colors[i % 4] + '">' + it.v + '</div></div>').join('') +
    '</div><div class="bar-labels">' + items.map(i => '<span>' + i.l + '</span>').join('') + '</div>';
}
function line(title, items) {
  const W = 520, H = 210, pl = 44, pr = 24, pt = 28, pb = 34;
  const max = Math.ceil(Math.max(...items.map(i => i.v)) / 10) * 10 + 10;
  const x = i => pl + i * (W - pl - pr) / (items.length - 1);
  const y = v => pt + (1 - v / max) * (H - pt - pb);
  let s = '<div class="chart-title">' + title + '</div><svg class="line" viewBox="0 0 ' + W + ' ' + H + '">';
  for (let g = 0; g <= max; g += 10)
    s += '<line x1="' + pl + '" x2="' + (W - pr) + '" y1="' + y(g) + '" y2="' + y(g) + '" stroke="#e5e2f0"/><text x="' + (pl - 8) + '" y="' + (y(g) + 4) + '" text-anchor="end" font-size="12" fill="#5b5875">' + g + '</text>';
  s += '<polyline fill="none" stroke="#ff3d7f" stroke-width="4" stroke-linejoin="round" points="' + items.map((it, i) => x(i) + ',' + y(it.v)).join(' ') + '"/>';
  items.forEach((it, i) => {
    s += '<circle cx="' + x(i) + '" cy="' + y(it.v) + '" r="7" fill="#8b5cf6" stroke="#fff" stroke-width="3"/>' +
         '<text x="' + x(i) + '" y="' + (y(it.v) - 13) + '" text-anchor="middle" font-weight="bold" font-size="15" fill="#1d1b2f">' + it.v + '</text>' +
         '<text x="' + x(i) + '" y="' + (H - 10) + '" text-anchor="middle" font-weight="bold" font-size="14" fill="#1d1b2f">' + it.l + '</text>';
  });
  return s + '</svg>';
}

const VENDAS = () => sheet(['Dia', 'Canetas vendidas'], [['Segunda', 12], ['Terça', 18], ['Quarta', 15], ['Quinta', 20], ['Sexta', 10]]);

const PHASE1 = [
  { q: 'A planilha de vendas de canetas da semana foi recuperada. Qual foi o TOTAL de canetas vendidas?',
    data: VENDAS, opts: ['65', '75', '80', '70'], a: 1,
    exp: '12 + 18 + 15 + 20 + 10 = 75 canetas. No Excel: =SOMA(B2:B6).' },
  { q: 'Na mesma planilha, qual foi a MÉDIA de canetas vendidas por dia?',
    data: VENDAS, opts: ['12', '18', '15', '20'], a: 2,
    exp: 'Média = total ÷ número de dias = 75 ÷ 5 = 15. No Excel: =MÉDIA(B2:B6).' },
  { q: 'O gráfico mostra os atendimentos do mês por setor. Qual setor teve MAIS atendimentos?',
    data: () => bars('Atendimentos por setor (mês)', [{ l: 'RH', v: 8 }, { l: 'Financeiro', v: 14 }, { l: 'Compras', v: 6 }, { l: 'Vendas', v: 22 }]),
    opts: ['RH', 'Financeiro', 'Compras', 'Vendas'], a: 3,
    exp: 'A barra mais alta é a de Vendas, com 22 atendimentos.' },
  { q: 'Numa pesquisa com 200 clientes, 50 fizeram reclamação. Qual o PERCENTUAL de clientes que reclamaram?',
    data: () => '', opts: ['50%', '20%', '25%', '40%'], a: 2,
    exp: '50 ÷ 200 = 0,25, ou seja, 25%. Percentual = parte ÷ total × 100.' },
  { q: 'O Caos dos Dados alterou um valor desta planilha de pedidos. Em qual produto o TOTAL está errado?',
    data: () => sheet(['Produto', 'Qtd', 'Preço unit.', 'Total'],
      [['Caderno', 4, 'R$ 10,00', 'R$ 40,00'], ['Lápis', 10, 'R$ 2,00', 'R$ 20,00'], ['Borracha', 5, 'R$ 3,00', 'R$ 18,00'], ['Régua', 2, 'R$ 6,00', 'R$ 12,00']], true),
    opts: ['Caderno', 'Lápis', 'Borracha', 'Régua'], a: 2,
    exp: 'Borracha: 5 × R$ 3,00 = R$ 15,00, e não R$ 18,00. Total = Qtd × Preço (no Excel: =B4*C4).' },
  { q: 'Notas de satisfação (1 a 5) de 7 clientes: 4, 5, 3, 5, 4, 5, 2. Qual é a MODA?',
    data: () => '', opts: ['3', '4', '5', '2'], a: 2,
    exp: 'Moda é o valor que mais se repete: a nota 5 aparece 3 vezes.' }
];

const PHASE2 = [
  { q: 'Tempo (em minutos) de 5 atendimentos: 7, 3, 9, 5, 11. Qual é a MEDIANA?',
    data: () => '', opts: ['5', '7', '9', '35'], a: 1,
    exp: 'Em ordem: 3, 5, 7, 9, 11. A mediana é o valor do meio: 7.' },
  { q: 'As vendas subiram de R$ 8.000 em março para R$ 10.000 em abril. Qual foi o AUMENTO percentual?',
    data: () => '', opts: ['20%', '25%', '2%', '80%'], a: 1,
    exp: 'Aumento = 2.000. 2.000 ÷ 8.000 = 0,25 = 25%. Sempre divida pelo valor ANTIGO.' },
  { q: 'O orçamento anual é de R$ 50.000 e 30% vão para Marketing. Quanto o Marketing recebe?',
    data: () => '', opts: ['R$ 1.500', 'R$ 30.000', 'R$ 15.000', 'R$ 35.000'], a: 2,
    exp: '30% de 50.000 = 0,30 × 50.000 = R$ 15.000.' },
  { q: 'Faturamento mensal (em mil reais). Em qual mês houve a MAIOR QUEDA em relação ao mês anterior?',
    data: () => line('Faturamento (R$ mil)', [{ l: 'Jan', v: 40 }, { l: 'Fev', v: 32 }, { l: 'Mar', v: 50 }, { l: 'Abr', v: 45 }]),
    opts: ['Fevereiro', 'Março', 'Abril', 'Janeiro'], a: 0,
    exp: 'Jan→Fev caiu 8 mil (40→32). Mar→Abr caiu 5 mil (50→45). Março subiu. A maior queda foi em Fevereiro.' },
  { q: 'Salários de uma equipe: R$ 2.000, R$ 2.100, R$ 2.200, R$ 2.300 e R$ 15.000 (diretor). Qual medida representa MELHOR o salário típico?',
    data: () => '', opts: ['Média', 'Mediana', 'Maior valor', 'Soma'], a: 1,
    exp: 'O salário de R$ 15.000 puxa a média para R$ 4.720. A mediana (R$ 2.200) não é afetada por valores extremos.' },
  { q: 'Um produto de R$ 250,00 está com 20% de desconto. Qual é o preço final?',
    data: () => '', opts: ['R$ 230', 'R$ 200', 'R$ 50', 'R$ 225'], a: 1,
    exp: '20% de 250 = 50. Preço final = 250 − 50 = R$ 200 (ou 250 × 0,80).' }
];

/* =========================================================
   CONFIGURAÇÃO
   ========================================================= */
const $ = id => document.getElementById(id);
const W = 960, H = 540, T = 40, GY = 480;
const MAX_LIVES = 3, BOSS_TIME = 40;
const GRAV = 0.6, MAXFALL = 14, SPEED = 4.8, JUMP = -13.4;
const FONT = '"Trebuchet MS", "Segoe UI", sans-serif';
const cv = $('cv');
let ctx = cv.getContext('2d');
let DPR = 1;
function fitCanvas() { DPR = Math.min(2, window.devicePixelRatio || 1); cv.width = W * DPR; cv.height = H * DPR; }
fitCanvas();

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const overlap = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
const rand = (a, b) => a + Math.random() * (b - a);
function shuffle(arr) { for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; }

/* =========================================================
   SOM
   ========================================================= */
let audioCtx = null, muted = false;
function beep(freqs, dur = 0.1, type = 'square', vol = 0.07) {
  if (muted) return;
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    freqs.forEach((f, i) => {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = type; o.frequency.value = f;
      const t = audioCtx.currentTime + i * dur;
      g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);

const midi = n => 440 * Math.pow(2, (n - 69) / 12);

function tone(n, t, d, type, vol) {
  const o = audioCtx.createOscillator(), g = audioCtx.createGain();
  o.type = type; o.frequency.value = midi(n);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.015);
  g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  o.connect(g); g.connect(audioCtx.destination); o.start(t); o.stop(t + d + 0.02);
}

const VICTORY = {
  bpm: 160,
  parts: [
    { type: 'square', vol: 0.05, notes: [[67,.5],[72,.5],[76,.5],[79,.5],[84,1],[79,1], [81,.5],[77,.5],[81,.5],[84,.5],[86,1.5],[84,.5], [83,.5],[79,.5],[83,.5],[86,.5],[88,1],[86,.5],[83,.5], [84,3]] },
    { type: 'square', vol: 0.025, notes: [[0,12],[76,3]] },

    { type: 'triangle', vol: 0.08, notes: [[48,1],[55,1],[48,1],[55,1], [53,1],[60,1],[53,1],[60,1], [55,1],[62,1],[55,1],[62,1], [48,3]] },
    { type: 'triangle', vol: 0.05, notes: [[0,.5],[72,.25],[0,1.25],[72,.25],[0,1.75], [0,.5],[77,.25],[0,1.25],[77,.25],[0,1.75], [0,.5],[79,.25],[0,1.25],[79,.25],[0,1.75]] }

};
function playVictory() {
  if (muted) return;
  try { audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; }
  const beat = 60 / VICTORY.bpm, t0 = audioCtx.currentTime + 0.05;
  VICTORY.parts.forEach(part => {
    let t = t0;
    part.notes.forEach(([n, b]) => { if (n) tone(n, t, b * beat * 0.95, part.type, part.vol); t += b * beat; });
  });
}
let mStep = 0, mNext = 0;
function musicTick(now) {
  if (muted || G.mode !== 'play' || !audioCtx) return;
  const m = MUSIC[G.phase];
  if (now < mNext) return;
  mNext = now + (G.ps && G.ps.some(p => p.texuga > 0) ? m.ms * 0.7 : m.ms);
  const i = mStep++ % m.bass.length;
  if (m.bass[i]) beep([midi(m.bass[i])], m.ms / 1000 * 0.9, 'triangle', 0.05);
  if (m.lead[i]) beep([midi(m.lead[i])], m.ms / 1000 * 0.8, 'square', 0.012);
}

const TEXUGA_TIME = 15 * 60;

function hitSecret(s) {
  if (s.used) { sfx.bonk(); s.bump = 10; return; }
  s.used = true; s.bump = 10;
  G.star = { x: s.x + 6, y: s.y - 6, w: 28, h: 28, rise: 20, t: 0, vx: 0, vy: 0, stopX: s.x + 110 };
  beep([523, 784, 1047, 1568], 0.07, 'triangle', 0.08);
  burst(s.x + 20, s.y, ['#ffd23f', '#fff'], 14, 4);
}

function updateStar() {
  for (const s of G.solids) if (s.kind === 'secret' && s.bump > 0) s.bump--;
  // pista discreta: um brilhinho de vez em quando onde o bloco secreto está
  const sec = G.solids.find(s => s.kind === 'secret');
  if (sec && !sec.used && G.frame % 60 === 0)
    for (let i = 0; i < 3; i++)
      G.parts.push({ x: sec.x + rand(4, 36), y: sec.y + rand(4, 36), vx: rand(-0.3, 0.3), vy: -0.4, life: 45, max: 45, c: '#fff3a0', s: 6, g: 0 });
  const st = G.star;
  if (!st) return;
  st.t++;
  if (st.rise > 0) { st.y -= 1.6; st.rise--; if (st.rise === 0) { st.vx = 1.8; st.vy = -3; } }
  else {
    // sai do bloco, cai no chão ao lado e fica quicando baixinho até você pegar
    st.vy += 0.3; st.y += st.vy;
    if (st.x < st.stopX) st.x += st.vx;
    if (st.y + st.h >= GY) { st.y = GY - st.h; st.vy = -5; }
  }
  const p = active().find(q => overlap(q, st));
  if (p) { G.star = null; startTexuga(p); }
}

function startTexuga(p) {
  G.gotStar = true; G.starOwner = p.idx;
  if (p.texuga <= 0) { p.y += p.h - 34; p.h = 34; }
  p.texuga = TEXUGA_TIME;
  beep([659, 784, 988, 1319, 988, 1319, 1568], 0.08, 'square', 0.06);
  burst(p.x + p.w / 2, p.y, ['#ffd23f', '#ff3d7f', '#22c55e', '#3b82f6', '#fff'], 40, 7);
  G.texts.push({ x: p.x + p.w / 2, y: p.y - 20, t: '🦡 TEXUGA!', life: 90 });
  addScore(500, p.x + p.w / 2, p.y - 50);
  feedback(true, '<b>🦡 Você achou o segredo e virou a TEXUGA LENDÁRIA!</b> Por 15 segundos você corre mais, pula mais alto e derrota qualquer bug só de encostar. E ela vai lembrar de você na hora do chefão...');
}

function updateTexuga(p) {
  if (G.frame % 3 === 0)
    G.parts.push({ x: p.x + p.w / 2 - p.face * 14, y: p.y + rand(4, p.h - 4), vx: -p.face * 0.5, vy: rand(-0.4, 0.4), life: 24, max: 24, c: 'hsl(' + (G.frame * 8 % 360) + ',95%,65%)', s: 5, g: 0 });
  if (p.texuga === 1) {
    // volta a ser gente: só se houver espaço acima, senão espera mais um pouco
    const tall = { x: p.x, y: p.y - (52 - p.h), w: p.w, h: 52 };
    if (G.solids.some(s => !s.open && !s.hidden && overlap(tall, s))) return;
    p.y = tall.y; p.h = 52; p.texuga = 0;
    burst(p.x + p.w / 2, p.y + 26, ['#fff', '#ffd23f'], 16, 4);
    beep([784, 523], 0.08, 'triangle', 0.06);
    return;
  }
  p.texuga--;
}

function updateHelper() {
  const h = G.helper; if (!h) return;
  const p = G.ps[G.starOwner || 0] && !G.ps[G.starOwner || 0].respawn ? G.ps[G.starOwner || 0] : active()[0] || G.p;
  const tx = clamp(p.x + p.w / 2 - p.face * 55, 30, W - 30);
  const dx = tx - h.x;
  h.x += clamp(dx * 0.09, -5, 5);
  if (Math.abs(dx) > 4) h.face = Math.sign(dx);
  if (h.cd > 0) h.cd--;
  if (h.hop > 0) h.hop--;
  if (h.cd > 0) return;
  for (const s of G.shots) {
    if (Math.hypot(s.x - h.x, s.y - (GY - 18)) < 95) {
      s.dead = true; h.cd = 120; h.hop = 20; h.face = Math.sign(s.x - h.x) || h.face; h.eaten++;
      burst(s.x, s.y, ['#ef4444', '#fff', '#ffd23f'], 14, 5);
      G.texts.push({ x: h.x, y: GY - 60, t: 'NHAC!', life: 50 });
      addScore(25, h.x, GY - 80);
      beep([300, 200, 400], 0.05, 'square', 0.06);
      break;
    }
  }
}

/* desenho da texuga: corpo cinza, rosto preto com a listra branca no meio */
function drawBadger(cx, by, face, sc, walking) {
  ctx.save();
  ctx.translate(cx, by); ctx.scale(face * sc, sc); ctx.translate(-24, -32);
  const sw = walking ? Math.sin(G.frame * 0.5) * 3 : 0;
  ctx.fillStyle = '#1f2937';
  ctx.fillRect(8 + sw, 22, 7, 10); ctx.fillRect(30 - sw, 22, 7, 10);
  ctx.fillStyle = '#6b7280'; ctx.beginPath(); ctx.ellipse(3, 15, 6, 4, -0.4, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#9ca3af'; ctx.beginPath(); ctx.ellipse(21, 17, 20, 11, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#6b7280'; ctx.beginPath(); ctx.ellipse(20, 11, 16, 5, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#fff'; circle(34, 7, 4);
  ctx.fillStyle = '#1f2937'; ctx.beginPath(); ctx.ellipse(40, 15, 11, 9, 0.15, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.moveTo(30, 8); ctx.quadraticCurveTo(42, 6, 50, 15); ctx.lineTo(48, 17); ctx.quadraticCurveTo(41, 11, 30, 12); ctx.fill();
  ctx.beginPath(); ctx.ellipse(41, 21, 7, 3, 0.2, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#111'; circle(50, 16, 2.6);
  ctx.fillStyle = '#fff'; circle(43, 13, 1.6);
  ctx.fillStyle = '#ff8fab'; circle(39, 19, 1.8);
  ctx.restore();
}

function drawHelper(h) {
  const hop = h.hop > 0 ? Math.sin((20 - h.hop) / 20 * Math.PI) * 26 : Math.abs(Math.sin(G.frame * 0.15)) * 2;
  drawBadger(h.x, GY - hop, h.face, 0.85, true);
  if (h.cd > 0) { ctx.fillStyle = 'rgba(255,255,255,.35)'; ctx.fillRect(h.x - 16, GY - 40, 32, 3); ctx.fillStyle = '#ffd23f'; ctx.fillRect(h.x - 16, GY - 40, 32 * (1 - h.cd / 120), 3); }
}

function drawSecret(s) {
  const off = s.bump > 0 ? -Math.sin((10 - s.bump) / 10 * Math.PI) * 8 : 0;
  if (!s.used) {
    // bloco arco-íris com a Texuga, bem chamativo
    ctx.fillStyle = 'rgba(255, 243, 160, .25)'; circle(s.x + 20, s.y + 20 + off, 30 + Math.sin(G.frame / 10) * 4);
    ctx.fillStyle = 'hsl(' + (G.frame * 4 % 360) + ', 90%, 60%)'; rr(s.x, s.y + off, s.w, s.h, 7); ctx.fill();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.stroke();
    drawBadger(s.x + 20, s.y + off + 31, 1, 0.62, false);
    ctx.fillStyle = '#fff'; ctx.font = 'bold 13px ' + FONT; ctx.textAlign = 'center';
    ctx.fillText('⬆ pule aqui!', s.x + 20, s.y + off - 12 + Math.sin(G.frame / 12) * 3);
    return;
  }
  ctx.fillStyle = '#a16207'; rr(s.x, s.y + off, s.w, s.h, 6); ctx.fill();
  ctx.strokeStyle = '#713f12'; ctx.lineWidth = 3; ctx.stroke();
  ctx.fillStyle = '#713f12'; [[5, 5], [32, 5], [5, 32], [32, 32]].forEach(([dx, dy]) => ctx.fillRect(s.x + dx, s.y + off + dy, 3, 3));
}

function drawStar(st) {
  const cx = st.x + 14, cy = st.y + 14 + Math.sin(st.t / 8) * 3, r = 15;
  ctx.save(); ctx.translate(cx, cy); ctx.rotate(Math.sin(st.t / 15) * 0.2);
  ctx.fillStyle = 'rgba(255, 210, 63, .3)'; circle(0, 0, r + 8 + Math.sin(st.t / 5) * 3);
  ctx.fillStyle = 'hsl(' + (st.t * 6 % 360) + ', 95%, 62%)';
  ctx.beginPath();
  for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, rr2 = i % 2 ? r * 0.45 : r; ctx.lineTo(Math.cos(a) * rr2, Math.sin(a) * rr2); }
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = '#111'; circle(-4, -1, 1.8); circle(4, -1, 1.8);
  ctx.restore();
}

function drawTexugaUI() {
  if (!G.ps || G.mode !== 'play') return;
  let y = 12;
  for (const p of G.ps) {
    if (p.texuga <= 0) continue;
    ctx.fillStyle = 'rgba(0,0,0,.5)'; rr(12, y, 230, 40, 12); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.font = 'bold 15px ' + FONT; ctx.textAlign = 'left';
    ctx.fillText('🦡 ' + (G.ps.length > 1 ? 'P' + (p.idx + 1) + ' ' : '') + 'MODO TEXUGA ' + Math.ceil(p.texuga / 60) + 's', 24, y + 19);
    ctx.fillStyle = 'hsl(' + (G.frame * 6 % 360) + ',95%,60%)'; ctx.fillRect(24, y + 27, 206 * p.texuga / TEXUGA_TIME, 5);
    y += 46;
  }
}

function hurt(dir, force, p = G.p) {
  if (G.mode !== 'play' || (!force && (p.inv > 0 || p.texuga > 0))) return;
  G.lives--; p.inv = 100; G.shake = 14; G.flash = 10;
  sfx.hurt();
  if (dir) { p.vx = dir * 6; p.vy = -6; }
  renderHud();
  if (G.lives <= 0) die();
}

function die() {
  G.mode = 'dying'; G.dieT = 90; G.lives = 0; renderHud();
  G.ps.forEach(p => { if (p.respawn) { p.respawn = false; p.y = H + 100; } p.vy = -11; p.dead = true; p.inv = 0; });
  setTimeout(sfx.lose, 300);
}

function hitBlock(b, p = G.p) {
  b.bump = 10;
  if (b.state !== 'idle') { sfx.bonk(); return; }
  if (G.phase === 1) {
    const st = G.stations[b.station];
    if (st.solved) return;
    if (b.idx === st.q.a) {
      b.state = 'right';
      st.blocks.forEach(o => { if (o !== b) o.state = 'off'; });
      st.solved = true; st.gate.open = true; G.right++; G.cur++;
      G.checkpoint = st.gate.x + 60;
      addScore(100, b.x + b.w / 2, b.y - 10);
      burst(b.x + b.w / 2, b.y, ['#ffd23f', '#22c55e', '#fff'], 24, 6);
      sfx.right(); setTimeout(sfx.door, 250);
      feedback(true, '<b>✅ Correto! O portão abriu.</b> ' + st.q.exp);
      renderCard(); renderHud();
    } else {
      b.state = 'wrong'; G.wrong++; sfx.wrong();
      feedback(false, '<b>❌ "' + b.text + '" não é a resposta.</b> Você perdeu uma vida. Releia o quadro e tente outro bloco!');
      hurt(0, true, p);
    }
  } else {
    bossAnswer(b, p);
  }
}

function bossAnswer(b, p = G.p) {
  if (G.wait > 0 || G.boss.dying) return;
  const q = PHASE2[G.bossQ[0]];
  if (b.idx === q.a) {
    b.state = 'right';
    G.blocks.forEach(o => { if (o !== b && o.state === 'idle') o.state = 'off'; });
    const pts = 150 + Math.ceil(G.qTime / 60) * 5;
    G.right++;
    addScore(pts, b.x + b.w / 2, b.y - 10);
    G.beams.push({ x: b.x + b.w / 2, y: b.y, life: 30 });
    G.boss.hp--; G.boss.flash = 25; G.shake = 12;
    sfx.hit();
    burst(G.boss.cx, G.boss.cy, ['#ffd23f', '#fff', '#ff3d7f'], 30, 7);
    feedback(true, '<b>💥 Golpe certeiro! +' + pts + '</b> ' + q.exp);
    G.bossQ.shift();
    if (G.boss.hp <= 0) { G.boss.dying = 150; G.boss.charge = 0; G.shots = []; }
    else G.wait = 70;
    renderHud();
  } else {
    b.state = 'wrong'; G.wrong++; sfx.wrong();
    feedback(false, '<b>❌ "' + b.text + '" não é a resposta.</b> O chefão riu de você e você perdeu uma vida. Tente outro bloco!');
    hurt(0, true, p);
  }
}

function collide(p, axis) {
  for (const s of G.solids) {
    if (s.open || !overlap(p, s)) continue;
    if (s.hidden && !(axis === 'y' && p.vy < 0 && p.y - p.vy >= s.y + s.h - 1)) continue;
    if (axis === 'x') {
      if (p.vx > 0) p.x = s.x - p.w; else if (p.vx < 0) p.x = s.x + s.w;
      p.vx = 0;
    } else {
      if (p.vy > 0) {
        if (p.vy > 7) { p.sq = -0.22; dust(p.x + p.w / 2, s.y); }
        p.y = s.y - p.h; p.vy = 0; p.on = true; p.jumping = false; p.stand = s;
      }
      else if (p.vy < 0) { p.y = s.y + s.h; p.vy = 1; if (s.kind === 'ans') hitBlock(s, p); if (s.kind === 'secret') hitSecret(s); }
    }
  }
}

function updatePlayer(p) {
  const keys = p.k;
  if (p.respawn) { // caiu no buraco no modo 2 jogadores: espera o colega pisar em chão firme e reaparece em cima dele
    const m = mateOf(p);
    if (m && !m.respawn && m.on) { p.respawn = false; p.x = m.x; p.y = m.y - 70; p.vx = p.vy = 0; p.inv = 90; }
    return;
  }
  const ax = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
  const spd = p.texuga > 0 ? 6.6 : SPEED;
  if (ax) { p.vx = clamp(p.vx + ax * 0.9, -spd, spd); p.face = ax; }
  else { p.vx *= 0.75; if (Math.abs(p.vx) < 0.1) p.vx = 0; }
  if (p.vx > spd || p.vx < -spd) p.vx *= 0.9;
  if (p.texuga > 0) updateTexuga(p);

  p.coyote = p.on ? 6 : p.coyote - 1;
  if (keys.jumpHit) { p.buf = 8; keys.jumpHit = false; } else if (p.buf > 0) p.buf--;
  if (p.buf > 0 && p.coyote > 0) { p.vy = p.texuga > 0 ? JUMP - 1.4 : JUMP; p.buf = 0; p.coyote = 0; p.jumping = true; p.sq = 0.2; sfx.jump(); dust(p.x + p.w / 2, p.y + p.h); }
  if (p.jumping && !keys.jump && p.vy < -5) p.vy = -5;
  p.vy = Math.min(p.vy + GRAV, MAXFALL);

  if (p.on && p.stand && p.stand.kind === 'mover') { p.x += p.stand.dx; collide(p, 'x'); }
  p.x += p.vx; collide(p, 'x');
  p.x = clamp(p.x, 0, G.worldW - p.w);
  p.on = false; p.stand = null;
  p.y += p.vy; collide(p, 'y');
  if (p.inv > 0) p.inv--;
  p.sq *= 0.82;

  if (p.y > H + 60) { // caiu no buraco
    G.lives--; G.shake = 14; sfx.hurt(); renderHud();
    if (G.lives <= 0) { die(); return; }
    const m = mateOf(p);
    if (m && !m.respawn) {
      feedback(false, '<b>🕳️ Caiu no buraco!</b> O time perdeu uma vida. Você volta em cima do seu colega.');
      p.respawn = true; p.vx = p.vy = 0; p.texuga = 0; p.h = 52;
      return;
    }
    feedback(false, '<b>🕳️ Caiu no buraco!</b> Você perdeu uma vida e voltou ao último portão.');
    p.x = G.checkpoint; p.y = GY - p.h - 20; p.vx = p.vy = 0; p.inv = 90;
    G.camX = clamp(p.x + p.w / 2 - W * 0.4, 0, G.worldW - W);
  }
}

function dust(x, y) {
  for (let i = 0; i < 7; i++)
    G.parts.push({ x: x + rand(-10, 10), y: y - 3, vx: rand(-1.8, 1.8), vy: rand(-1.5, -0.3), life: 22, max: 22, c: 'rgba(255,255,255,.7)', s: rand(3, 5), g: 0.05 });
}

function updateLevel1() {
  updateStar();
  for (const p of active()) updateLevel1For(p);
  for (const g of G.gates) if (g.open && g.fade > 0) g.fade -= 0.04;
}

function updateEnemies() {
  for (const e of G.enemies) {
    if (!e.alive) { if (e.dead > 0) { e.dead--; if (e.fly) { e.vy = (e.vy || 0) + 0.5; e.y += e.vy; } } continue; }
    e.x += e.vx;
    if (e.fly) { e.t += 0.05; e.y = e.y0 + Math.sin(e.t) * e.amp; }
    if (e.x < e.x1) { e.x = e.x1; e.vx *= -1; }
    if (e.x + e.w > e.x2) { e.x = e.x2 - e.w; e.vx *= -1; }
  }
}

function updateLevel1For(p) {
  for (const e of G.enemies) {
    if (!e.alive) continue;
    if (overlap(p, e)) {
      if (p.texuga > 0) {
        e.alive = false; e.dead = 30; G.stomps++; sfx.stomp();
        burst(e.x + e.w / 2, e.y + 10, ['#ff4d6d', '#fff', '#ffd23f'], 14, 5);
        addScore(50, e.x + e.w / 2, e.y - 10);
      } else if (p.vy > 0 && p.y + p.h - p.vy <= e.y + 10) {
        e.alive = false; e.dead = 30; p.vy = -9; p.jumping = false; G.stomps++;
        sfx.stomp(); burst(e.x + e.w / 2, e.y + 10, ['#ff4d6d', '#fff'], 12, 4);
        addScore(50, e.x + e.w / 2, e.y - 10);
      } else hurt(p.x + p.w / 2 < e.x + e.w / 2 ? -1 : 1, false, p);
    }
  }
  for (const c of G.coins) {
    if (!c.taken && overlap(p, c)) {
      c.taken = true; G.coinsN++; sfx.coin();
      burst(c.x + 12, c.y + 12, ['#ffd23f', '#fff'], 6, 3);
      addScore(10, c.x + 12, c.y - 4);
    }
  }
  if (G.door && overlap(p, G.door) && G.mode === 'play') bossIntro();
}

function updateBoss() {
  const b = G.boss;
  if (b.dying > 0) {
    b.dying--;
    if (b.dying % 8 === 0) { burst(b.cx + rand(-70, 70), b.cy + rand(-50, 50), ['#ff3d7f', '#ffd23f', '#8b5cf6', '#fff'], 18, 6); sfx.stomp(); G.shake = 6; }
    if (b.dying === 0) endGame(true);
    return;
  }
  b.t++;
  const anger = b.max - b.hp;
  b.cx = 480 + Math.sin(b.t / (110 - anger * 6)) * 300;
  b.cy = 120 + Math.sin(b.t / 37) * 18;
  if (b.flash > 0) b.flash--;

  if (G.wait > 0) { G.wait--; if (G.wait === 0) setBossQuestion(); }
  else {
    G.qTime--;
    if (G.qTime % 15 === 0) $('cTimer').style.width = (G.qTime / (BOSS_TIME * 60) * 100) + '%';
    if (G.qTime <= 600 && G.qTime % 60 === 0) beep([880], 0.04, 'square', 0.03);
    if (G.qTime <= 0) {
      G.wrong++;
      feedback(false, '<b>⏰ O tempo acabou!</b> Você perdeu uma vida. O relógio recomeçou, tente de novo!');
      G.qTime = BOSS_TIME * 60;
      hurt(0, true, active()[0] || G.p);
    }
  }

  // o chefão carrega o tiro (boca brilha) antes de atirar, para dar tempo de desviar
  if (b.charge > 0) {
    b.charge--;
    if (b.charge === 0) {
      const sp = 3.6 + anger * 0.35;
      const targets = active(); b.aim = ((b.aim || 0) + 1) % Math.max(1, targets.length);
      const p = targets[b.aim] || G.p;
      const dx = p.x + p.w / 2 - b.cx, dy = p.y + p.h / 2 - (b.cy + 40);
      const base = Math.atan2(dy, dx);
      const angles = b.hp <= 3 ? [base - 0.28, base, base + 0.28] : [base];
      angles.forEach(a => G.shots.push({ x: b.cx, y: b.cy + 40, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, r: 15 }));
      beep([520, 260], 0.06, 'sawtooth', 0.05);
      b.shootT = 130 - anger * 12;
    }
  } else if (--b.shootT <= 0) b.charge = 40;
  updateHelper();
  for (const s of G.shots) {
    s.x += s.vx; s.y += s.vy;
    for (const p of active()) {
      if (s.dead) break;
      const cx = clamp(s.x, p.x, p.x + p.w), cy = clamp(s.y, p.y, p.y + p.h);
      if (Math.hypot(s.x - cx, s.y - cy) < s.r) { s.dead = true; hurt(s.vx > 0 ? 1 : -1, false, p); burst(s.x, s.y, ['#ef4444', '#fff'], 10, 4); }
    }
    if (s.y > GY + 10 || s.x < -40 || s.x > W + 40) { s.dead = true; if (s.y > GY) burst(s.x, GY, ['#ef4444', '#ff8c42'], 6, 3); }
  }
  G.shots = G.shots.filter(s => !s.dead);
  G.beams.forEach(bm => bm.life--);
  G.beams = G.beams.filter(bm => bm.life > 0);
}

function update() {
  if (G.mode === 'paused' || G.mode === 'menu') return;
  G.frame++;
  for (const pt of G.parts) { pt.x += pt.vx; pt.y += pt.vy; pt.vy += pt.g ?? 0.2; pt.life--; }
  G.parts = G.parts.filter(pt => pt.life > 0);
  for (const t of G.texts) { t.y -= 0.8; t.life--; }
  G.texts = G.texts.filter(t => t.life > 0);
  for (const b of G.blocks) if (b.bump > 0) b.bump--;
  if (G.shake > 0) G.shake--;
  if (G.flash > 0) G.flash--;

  if (G.mode === 'dying') {
    G.dieT--;
    if (G.dieT < 60) for (const p of G.ps) { p.vy = Math.min(p.vy + GRAV, MAXFALL); p.y += p.vy; }
    if (G.dieT <= 0) endGame(false);
    return;
  }
  if (G.mode !== 'play') return;

  for (const s of G.solids) if (s.kind === 'mover') {
    const nx = s.x0 + Math.sin(G.frame * s.speed) * s.range; s.dx = nx - s.x; s.x = nx;
  }
  for (const p of G.ps) { updatePlayer(p); if (G.mode !== 'play') return; }
  leash();
  if (G.phase === 1) { updateEnemies(); updateLevel1(); } else updateBoss();
  const ps = active(); if (!ps.length) return;
  const mid = ps.reduce((a, p) => a + p.x + p.w / 2, 0) / ps.length;
  const target = clamp(mid - W * (ps.length > 1 ? 0.5 : 0.4), 0, G.worldW - W);
  G.camX += (target - G.camX) * 0.14;
}

// no modo 2 jogadores ninguém pode se afastar a ponto de sair da tela
const LEASH = W - 140;
function leash() {
  const ps = active(); if (ps.length < 2) return;
  const [a, b] = ps;
  for (const [p, o] of [[a, b], [b, a]]) {
    if (p.x > o.x + LEASH) { p.x = o.x + LEASH; if (p.vx > 0) p.vx = 0; }
    if (p.x < o.x - LEASH) { p.x = o.x - LEASH; if (p.vx < 0) p.vx = 0; }
  }
}

function togglePause() {
  if (G.mode === 'play') {
    G.mode = 'paused';
    overlay('<span class="tag">Pausa</span><h1>Jogo pausado</h1><div class="big">☕</div><p>Aproveite para reler o quadro com calma.</p><button class="btn" id="ovBtn">▶ Continuar</button>',
      () => { G.mode = 'play'; });
  }
}
addEventListener('keydown', e => {
  if (e.code === 'Escape' || e.code === 'KeyP') {
    if (G.mode === 'play') togglePause();
    else if (G.mode === 'paused') $('ovBtn').click();
  }
});
document.addEventListener('visibilitychange', () => { if (document.hidden) togglePause(); });

/* =========================================================
   DESENHO
   ========================================================= */
function rr(x, y, w, h, r) {
  ctx.beginPath(); ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function circle(x, y, r) { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); }
function fitFont(t, maxW, base) { let s = base; do { ctx.font = 'bold ' + s + 'px ' + FONT; } while (ctx.measureText(t).width > maxW && --s > 9); }

let seed = 11; const srnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
const BLD = []; for (let bx = 0; bx < 2000;) { const w = 60 + srnd() * 90, h = 110 + srnd() * 210; BLD.push({ x: bx, w, h }); bx += w + 8 + srnd() * 30; }
const STARS = Array.from({ length: 60 }, () => ({ x: srnd() * 1920, y: srnd() * 260, r: srnd() * 1.6 + .4 }));
const CHART = Array.from({ length: 14 }, () => 80 + srnd() * 260);

function drawBackground() {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#1e1450'); g.addColorStop(.6, '#4b2a8c'); g.addColorStop(1, '#a8457a');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = 'rgba(255,255,255,.7)';
  const so = (G.camX * 0.05) % 1920;
  for (const s of STARS) { let x = s.x - so; if (x < 0) x += 1920; if (x < W) circle(x, s.y, s.r); }
  // gráfico de barras gigante ao fundo
  const co = (G.camX * 0.15) % 1400;
  ctx.fillStyle = 'rgba(255,255,255,.06)';
  for (let rep = 0; rep < 2; rep++) CHART.forEach((h, i) => ctx.fillRect(i * 100 - co + rep * 1400, GY - h, 60, h));
  // prédios
  const bo = (G.camX * 0.35) % 2000;
  for (let rep = 0; rep < 2; rep++) for (let i = 0; i < BLD.length; i++) {
    const b = BLD[i], x = b.x - bo + rep * 2000;
    if (x > W || x + b.w < 0) continue;
    ctx.fillStyle = '#24184f'; ctx.fillRect(x, GY - b.h, b.w, b.h);
    ctx.fillStyle = 'rgba(255, 210, 63, .55)';
    for (let wy = GY - b.h + 12; wy < GY - 14; wy += 18) for (let wx = x + 8; wx < x + b.w - 10; wx += 16)
      if (((wx - x) * 7 + wy * 13 + i * 31) % 5 === 0) ctx.fillRect(wx, wy, 7, 9);
  }
}

function drawSolid(s) {
  if (s.kind === 'wall' || s.kind === 'gate' || s.kind === 'ans') return;
  if (s.kind === 'secret') { drawSecret(s); return; }
  if (s.kind === 'mover') {
    ctx.fillStyle = '#ffd23f'; rr(s.x, s.y, s.w, s.h, 6); ctx.fill();
    ctx.save(); rr(s.x, s.y, s.w, s.h, 6); ctx.clip();
    ctx.fillStyle = '#1d1b2f';
    for (let x = s.x - 20; x < s.x + s.w; x += 24) { ctx.beginPath(); ctx.moveTo(x, s.y + s.h); ctx.lineTo(x + 12, s.y); ctx.lineTo(x + 22, s.y); ctx.lineTo(x + 10, s.y + s.h); ctx.fill(); }
    ctx.restore();
    ctx.fillStyle = 'rgba(255,255,255,.5)';
    ctx.font = 'bold 14px ' + FONT; ctx.textAlign = 'center'; ctx.fillText('⇆', s.x + s.w / 2, s.y + 38);
    return;
  }
  ctx.fillStyle = '#107c41'; ctx.fillRect(s.x, s.y, s.w, s.h);
  ctx.strokeStyle = 'rgba(255,255,255,.16)'; ctx.lineWidth = 1;
  ctx.beginPath();
  for (let x = s.x + 40; x < s.x + s.w; x += 40) { ctx.moveTo(x + .5, s.y + 8); ctx.lineTo(x + .5, s.y + s.h); }
  for (let y = s.y + 28; y < s.y + s.h; y += 20) { ctx.moveTo(s.x, y + .5); ctx.lineTo(s.x + s.w, y + .5); }
  ctx.stroke();
  ctx.fillStyle = '#33c481'; ctx.fillRect(s.x, s.y, s.w, 8);
  if (s.kind === 'plat') { ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.fillRect(s.x, s.y + s.h - 4, s.w, 4); }
}

function drawSign(sg) {
  ctx.fillStyle = '#6b4226'; ctx.fillRect(sg.x + 52, GY - 70, 8, 70);
  ctx.fillStyle = '#f5e6c8'; rr(sg.x, GY - 110, 112, 48, 8); ctx.fill();
  ctx.strokeStyle = '#6b4226'; ctx.lineWidth = 3; ctx.stroke();
  ctx.fillStyle = '#3a2a1a'; ctx.textAlign = 'center';
  sg.lines.forEach((l, i) => { fitFont(l, 100, i ? 12 : 15); ctx.fillText(l, sg.x + 56, GY - 90 + i * 18); });
}

function drawDoor(d) {
  ctx.fillStyle = '#2a1d3d'; rr(d.x - 8, d.y - 8, d.w + 16, d.h + 8, 10); ctx.fill();
  ctx.fillStyle = '#7c2d12'; rr(d.x, d.y, d.w, d.h, 6); ctx.fill();
  ctx.fillStyle = '#ffd23f'; circle(d.x + d.w - 16, d.y + d.h / 2, 5);
  ctx.fillStyle = '#ef4444'; rr(d.x - 14, d.y - 46, d.w + 28, 30, 8); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.font = 'bold 15px ' + FONT;
  ctx.fillText('SALA DO CHEFÃO', d.x + d.w / 2, d.y - 26);
  ctx.font = '34px sans-serif'; ctx.fillText('👾', d.x + d.w / 2, d.y + 55 + Math.sin(G.frame / 15) * 4);
}

function drawGate(g) {
  if (g.open && g.fade <= 0) return;
  ctx.save(); ctx.globalAlpha = Math.max(0, g.fade);
  ctx.fillStyle = 'rgba(239, 68, 68, .35)'; ctx.fillRect(g.x, 0, g.w, GY);
  ctx.strokeStyle = '#ff4d6d'; ctx.lineWidth = 3;
  for (let i = 0; i < 3; i++) { const x = g.x + 6 + i * 9; ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, GY); ctx.stroke(); }
  ctx.font = '26px sans-serif'; ctx.textAlign = 'center'; ctx.fillText('🔒', g.x + g.w / 2, 260 + Math.sin(G.frame / 12) * 4);
  ctx.restore();
}

function drawCoin(c) {
  if (c.taken) return;
  const s = Math.abs(Math.cos(G.frame * 0.08 + c.x * 0.01));
  ctx.fillStyle = '#ffd23f'; ctx.strokeStyle = '#c98a00'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.ellipse(c.x + 12, c.y + 12, 11 * s + 1, 11, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  if (s > .5) { ctx.fillStyle = '#a16207'; ctx.font = 'bold 13px ' + FONT; ctx.textAlign = 'center'; ctx.fillText('$', c.x + 12, c.y + 17); }
}

function drawBlock(b) {
  const off = b.bump > 0 ? -Math.sin((10 - b.bump) / 10 * Math.PI) * 9 : 0;
  const pal = { idle: ['#ffd23f', '#b7791f', '#3a2a00'], right: ['#22c55e', '#15803d', '#fff'], wrong: ['#ef4444', '#991b1b', '#fff'], off: ['#a8a3b8', '#6b6680', '#fff'] }[b.state];
  const y = b.y + off;
  ctx.fillStyle = 'rgba(0,0,0,.25)'; rr(b.x + 3, y + 5, b.w, b.h, 9); ctx.fill();
  ctx.fillStyle = pal[0]; rr(b.x, y, b.w, b.h, 9); ctx.fill();
  ctx.strokeStyle = pal[1]; ctx.lineWidth = 3; ctx.stroke();
  ctx.fillStyle = pal[1];
  [[6, 6], [b.w - 9, 6], [6, b.h - 9], [b.w - 9, b.h - 9]].forEach(([dx, dy]) => ctx.fillRect(b.x + dx, y + dy, 3, 3));
  ctx.fillStyle = pal[2]; ctx.textAlign = 'center';
  const label = b.state === 'right' ? '✔ ' + b.text : b.state === 'wrong' ? '✖ ' + b.text : b.text;
  fitFont(label, b.w - 18, 18);
  ctx.fillText(label, b.x + b.w / 2, y + b.h / 2 + 6);
}

function drawFlyer(e) {
  const dir = Math.sign(e.vx) || 1, x = e.x, y = e.y;
  ctx.save();
  if (!e.alive) { if (e.dead <= 0) { ctx.restore(); return; } ctx.globalAlpha = e.dead / 30; ctx.translate(x + e.w / 2, y + e.h / 2); ctx.rotate(Math.PI); ctx.translate(-x - e.w / 2, -y - e.h / 2); }
  const flap = Math.sin(G.frame * 0.5) * 9;
  ctx.fillStyle = '#7dd3fc';
  [[x + 4, -1], [x + e.w - 4, 1]].forEach(([wx, s]) => {
    ctx.beginPath(); ctx.moveTo(wx, y + 10); ctx.lineTo(wx + s * 18, y - 4 - flap); ctx.lineTo(wx + s * 14, y + 14); ctx.closePath(); ctx.fill();
  });
  ctx.fillStyle = '#0ea5e9'; rr(x, y, e.w, e.h, 12); ctx.fill();
  ctx.fillStyle = '#fff'; circle(x + 12, y + 9, 5); circle(x + 24, y + 9, 5);
  ctx.fillStyle = '#111'; circle(x + 12 + dir * 2, y + 10, 2.3); circle(x + 24 + dir * 2, y + 10, 2.3);
  ctx.fillStyle = '#fff'; ctx.font = 'bold 8px ' + FONT; ctx.textAlign = 'center';
  ctx.fillText('#DIV/0!', x + e.w / 2, y + 22);
  ctx.restore();
}

function drawEnemy(e) {
  if (e.fly) return drawFlyer(e);
  if (!e.alive) {
    if (e.dead <= 0) return;
    ctx.fillStyle = '#ff4d6d'; rr(e.x - 2, e.y + e.h - 9, e.w + 4, 9, 4); ctx.fill(); return;
  }
  const bob = Math.sin(G.frame * 0.25 + e.x) * 2, dir = Math.sign(e.vx) || 1;
  ctx.fillStyle = '#b3123b';
  const step = Math.sin(G.frame * 0.3) * 3;
  ctx.fillRect(e.x + 6 + step, e.y + e.h - 6, 8, 6); ctx.fillRect(e.x + e.w - 14 - step, e.y + e.h - 6, 8, 6);
  ctx.fillStyle = '#ff4d6d'; rr(e.x, e.y + bob, e.w, e.h - 4, 9); ctx.fill();
  ctx.fillStyle = '#fff'; circle(e.x + 11, e.y + 10 + bob, 5); circle(e.x + 23, e.y + 10 + bob, 5);
  ctx.fillStyle = '#111'; circle(e.x + 11 + dir * 2, e.y + 11 + bob, 2.3); circle(e.x + 23 + dir * 2, e.y + 11 + bob, 2.3);
  ctx.strokeStyle = '#111'; ctx.lineWidth = 2; ctx.beginPath();
  ctx.moveTo(e.x + 6, e.y + 3 + bob); ctx.lineTo(e.x + 15, e.y + 6 + bob);
  ctx.moveTo(e.x + 28, e.y + 3 + bob); ctx.lineTo(e.x + 19, e.y + 6 + bob); ctx.stroke();
  ctx.fillStyle = '#fff'; ctx.font = 'bold 8px ' + FONT; ctx.textAlign = 'center';
  ctx.fillText('#REF!', e.x + e.w / 2, e.y + 23 + bob);
}

function drawPlayer(p) {
  if (!p.dead && p.inv > 0 && Math.floor(p.inv / 4) % 2 === 0) return;
  ctx.save();
  // achata ao cair e estica ao pular; gira de cabeça para baixo ao morrer
  const cxp = p.x + p.w / 2, by = p.y + p.h;
  ctx.translate(cxp, by);
  if (p.dead) { ctx.translate(0, -p.h / 2); ctx.rotate(Math.PI); ctx.translate(0, p.h / 2); }
  else ctx.scale(1 - p.sq * 0.6, 1 + p.sq);
  ctx.translate(-cxp, -by);
  if (p.texuga > 0 && !(p.texuga < 120 && Math.floor(p.texuga / 6) % 2)) drawBadger(p.x + p.w / 2, p.y + p.h, p.face, 1.35, Math.abs(p.vx) > 0.6 && p.on);
  else drawPlayerBody(p);
  ctx.restore();
}

function drawPlayerBody(p) {
  const c = p.ch || CHARS[0];
  const x = Math.round(p.x), y = Math.round(p.y), f = p.face;
  const moving = Math.abs(p.vx) > 0.6 && p.on;
  const sw = moving ? Math.sin(G.frame * 0.4) * 5 : 0;
  const air = !p.on;
  ctx.fillStyle = c.pants;
  ctx.fillRect(x + 7 + sw, y + 38, 7, air ? 11 : 13); ctx.fillRect(x + 16 - sw, y + 38, 7, air ? 9 : 13);
  ctx.fillStyle = '#111';
  ctx.fillRect(x + 5 + sw + (f > 0 ? 2 : 0), y + (air ? 47 : 49), 10, 4); ctx.fillRect(x + 14 - sw + (f > 0 ? 2 : 0), y + (air ? 45 : 49), 10, 4);
  // rabo de cavalo fica atrás do corpo
  if (c.style === 'ponytail') { ctx.fillStyle = c.hair; ctx.beginPath(); ctx.ellipse(x + 15 - f * 13, y + 13 + Math.sin(G.frame * 0.3) * (moving ? 2 : 0), 5, 9, -f * 0.4, 0, Math.PI * 2); ctx.fill(); }
  ctx.fillStyle = c.sleeve; ctx.fillRect(x + 1 + (air ? -2 : 0), y + 22 - (air ? 6 : 0) - sw * .3, 5, 14); ctx.fillRect(x + 24 + (air ? 2 : 0), y + 22 - (air ? 6 : 0) + sw * .3, 5, 14);
  ctx.fillStyle = c.shirt; rr(x + 4, y + 20, 22, 20, 5); ctx.fill();
  if (c.tie) { ctx.fillStyle = c.acc; ctx.beginPath(); ctx.moveTo(x + 13, y + 21); ctx.lineTo(x + 17, y + 21); ctx.lineTo(x + 15, y + 34); ctx.fill(); }
  else { ctx.fillStyle = c.acc; ctx.fillRect(x + 8, y + 21, 14, 3); }
  ctx.fillStyle = '#ffffff'; ctx.fillRect(x + 19 - (f < 0 ? 12 : 0), y + 25, 5, 6);
  ctx.fillStyle = c.skin; circle(x + 15, y + 11, 11);
  ctx.fillStyle = c.hair;
  if (c.style === 'curly') {
    for (const [dx, dy] of [[-9, 4], [-6, -1], [-1, -3], [5, -2], [9, 2], [-11, 9]]) circle(x + 15 + dx * (dx === -11 ? f : 1), y + 6 + dy, 5);
  } else if (c.style === 'cap') {
    ctx.beginPath(); ctx.arc(x + 15, y + 9, 11.5, Math.PI, 0); ctx.fill();
    ctx.fillStyle = c.acc; ctx.beginPath(); ctx.arc(x + 15, y + 7, 11.5, Math.PI, 0); ctx.fill();
    ctx.fillRect(x + 15 + (f > 0 ? 4 : -16), y + 5, 12, 4);
  } else {
    ctx.beginPath(); ctx.arc(x + 15, y + 9, 11.5, Math.PI, 0); ctx.fill();
    ctx.fillRect(x + 15 - f * 11 - 2, y + 8, 4, 6);
  }
  ctx.fillStyle = '#111'; circle(x + 15 + f * 5, y + 12, 1.9);
  if (c.glasses) { ctx.strokeStyle = '#111'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(x + 15 + f * 5, y + 12, 3.6, 0, Math.PI * 2); ctx.stroke(); ctx.beginPath(); ctx.moveTo(x + 15 + f * 1.4, y + 12); ctx.lineTo(x + 15 - f * 4, y + 11); ctx.stroke(); }
  ctx.strokeStyle = '#8a4b2a'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(x + 15 + f * 4, y + 15, 3, 0.2, Math.PI - 0.2); ctx.stroke();
}

function drawTag(p) {
  const cx = p.x + p.w / 2, y = p.y - 22 + Math.sin(G.frame / 10) * 2;
  ctx.fillStyle = PCOLORS[p.idx]; rr(cx - 15, y - 9, 30, 17, 8); ctx.fill();
  ctx.beginPath(); ctx.moveTo(cx - 5, y + 8); ctx.lineTo(cx + 5, y + 8); ctx.lineTo(cx, y + 13); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.font = 'bold 11px ' + FONT; ctx.textAlign = 'center'; ctx.fillText('P' + (p.idx + 1), cx, y + 4);
}

function drawBoss() {
  const b = G.boss; if (!b) return;
  ctx.save();
  if (b.dying) { ctx.globalAlpha = b.dying / 150; ctx.translate(rand(-4, 4), rand(-4, 4)); }
  const x = b.cx - b.w / 2, y = b.cy - b.h / 2;
  ctx.fillStyle = '#4c1d95';
  ctx.beginPath(); ctx.moveTo(x + 22, y + 10); ctx.lineTo(x + 34, y - 30); ctx.lineTo(x + 52, y + 6); ctx.fill();
  ctx.beginPath(); ctx.moveTo(x + b.w - 22, y + 10); ctx.lineTo(x + b.w - 34, y - 30); ctx.lineTo(x + b.w - 52, y + 6); ctx.fill();
  ctx.fillStyle = b.flash && b.flash % 6 < 3 ? '#fff' : '#7c3aed';
  rr(x, y, b.w, b.h, 26); ctx.fill();
  ctx.save(); rr(x, y, b.w, b.h, 26); ctx.clip();
  ctx.strokeStyle = 'rgba(255,255,255,.18)'; ctx.lineWidth = 1; ctx.beginPath();
  for (let gx = x + 24; gx < x + b.w; gx += 24) { ctx.moveTo(gx, y); ctx.lineTo(gx, y + b.h); }
  for (let gy = y + 18; gy < y + b.h; gy += 18) { ctx.moveTo(x, gy); ctx.lineTo(x + b.w, gy); }
  ctx.stroke(); ctx.restore();
  const p = G.p, lx = p.x + p.w / 2 - b.cx, ly = p.y - b.cy, d = Math.hypot(lx, ly) || 1;
  [-38, 38].forEach(dx => {
    ctx.fillStyle = '#fff'; circle(b.cx + dx, b.cy - 14, 19);
    ctx.fillStyle = '#ef4444'; circle(b.cx + dx + lx / d * 8, b.cy - 14 + ly / d * 8, 8);
    ctx.fillStyle = '#111'; circle(b.cx + dx + lx / d * 9, b.cy - 14 + ly / d * 9, 3.5);
  });
  ctx.strokeStyle = '#1e0b45'; ctx.lineWidth = 6; ctx.lineCap = 'round'; ctx.beginPath();
  ctx.moveTo(b.cx - 60, b.cy - 44); ctx.lineTo(b.cx - 20, b.cy - 30);
  ctx.moveTo(b.cx + 60, b.cy - 44); ctx.lineTo(b.cx + 20, b.cy - 30); ctx.stroke(); ctx.lineCap = 'butt';
  ctx.fillStyle = '#1e0b45'; rr(b.cx - 46, b.cy + 18, 92, 26, 8); ctx.fill();
  ctx.fillStyle = '#fff';
  for (let i = 0; i < 6; i++) { ctx.beginPath(); ctx.moveTo(b.cx - 44 + i * 15, b.cy + 18); ctx.lineTo(b.cx - 36 + i * 15, b.cy + 30); ctx.lineTo(b.cx - 29 + i * 15, b.cy + 18); ctx.fill(); }
  if (b.charge > 0) {
    const k = 1 - b.charge / 40;
    ctx.fillStyle = 'rgba(255, 80, 80,' + (0.25 + k * 0.5) + ')'; circle(b.cx, b.cy + 40, 8 + k * 22);
    ctx.fillStyle = 'rgba(255, 230, 120,' + k + ')'; circle(b.cx, b.cy + 40, 4 + k * 9);
  }
  ctx.restore();
}

function drawBossUI() {
  const b = G.boss; if (!b) return;
  ctx.fillStyle = 'rgba(0,0,0,.45)'; rr(270, 10, 420, 46, 12); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.font = 'bold 13px ' + FONT; ctx.textAlign = 'left';
  ctx.fillText('👾 CAOS DOS DADOS', 284, 28);
  ctx.textAlign = 'right'; ctx.fillText('⏱ ' + Math.ceil(Math.max(0, G.qTime) / 60) + 's', 676, 28);
  ctx.fillStyle = '#3b1d1d'; rr(284, 34, 392, 12, 6); ctx.fill();
  const g = ctx.createLinearGradient(284, 0, 676, 0); g.addColorStop(0, '#ef4444'); g.addColorStop(1, '#ff8c42');
  ctx.fillStyle = g; if (b.hp > 0) { rr(284, 34, 392 * b.hp / b.max, 12, 6); ctx.fill(); }
  ctx.fillStyle = '#ffd23f'; ctx.fillRect(284, 49, 392 * Math.max(0, G.qTime) / (BOSS_TIME * 60), 3);
}

function render() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  drawBackground();
  ctx.save();
  const sx = G.shake ? rand(-4, 4) : 0, sy = G.shake ? rand(-4, 4) : 0;
  ctx.translate(-Math.round(G.camX) + sx, sy);
  const vis = o => o.x + (o.w || 120) > G.camX - 50 && o.x < G.camX + W + 50;
  (G.signs || []).filter(vis).forEach(drawSign);
  (G.solids || []).filter(vis).forEach(drawSolid);
  if (G.door && vis(G.door)) drawDoor(G.door);
  (G.gates || []).filter(vis).forEach(drawGate);
  (G.coins || []).filter(vis).forEach(drawCoin);
  (G.blocks || []).filter(vis).forEach(drawBlock);
  (G.enemies || []).filter(vis).forEach(drawEnemy);
  if (G.phase === 2) drawBoss();
  for (const bm of G.beams || []) {
    ctx.strokeStyle = 'rgba(255, 210, 63,' + bm.life / 30 + ')'; ctx.lineWidth = 12 * bm.life / 30 + 2;
    ctx.beginPath(); ctx.moveTo(bm.x, bm.y); ctx.lineTo(G.boss.cx, G.boss.cy); ctx.stroke();
  }
  if (G.star) drawStar(G.star);
  if (G.helper) drawHelper(G.helper);
  if (G.ps) G.ps.forEach(p => { if (!p.respawn) { drawPlayer(p); if (G.ps.length > 1 && !p.dead) drawTag(p); } });
  for (const s of G.shots || []) {
    ctx.fillStyle = 'rgba(239,68,68,.3)'; circle(s.x, s.y, s.r + 5);
    ctx.fillStyle = '#ef4444'; circle(s.x, s.y, s.r);
    ctx.fillStyle = '#fff'; ctx.font = 'bold 9px ' + FONT; ctx.textAlign = 'center'; ctx.fillText('#ERRO', s.x, s.y + 3);
  }
  for (const pt of G.parts || []) { ctx.globalAlpha = pt.life / pt.max; ctx.fillStyle = pt.c; ctx.fillRect(pt.x, pt.y, pt.s, pt.s); }
  ctx.globalAlpha = 1;
  for (const t of G.texts || []) {
    ctx.globalAlpha = Math.min(1, t.life / 30); ctx.font = 'bold 20px ' + FONT; ctx.textAlign = 'center';
    ctx.fillStyle = '#000'; ctx.fillText(t.t, t.x + 2, t.y + 2); ctx.fillStyle = '#ffd23f'; ctx.fillText(t.t, t.x, t.y);
  }
  ctx.globalAlpha = 1;
  ctx.restore();
  if (G.phase === 2) drawBossUI();
  drawBanner();
  drawTexugaUI();
  if (G.flash > 0) { ctx.fillStyle = 'rgba(239, 68, 68,' + G.flash / 30 + ')'; ctx.fillRect(0, 0, W, H); }
}

function wrapLines(text, maxW) {
  const words = text.split(' '), lines = []; let cur = '';
  for (const w of words) {
    const t = cur ? cur + ' ' + w : w;
    if (ctx.measureText(t).width > maxW && cur) { lines.push(cur); cur = w; } else cur = t;
  }
  if (cur) lines.push(cur);
  return lines;
}

// faixa com a pergunta dentro do jogo, sobre o chão (ajuda quem joga no celular)
function drawBanner() {
  if (G.mode !== 'play' && G.mode !== 'paused') return;
  let label, q;
  if (G.phase === 1) {
    const st = G.stations[G.cur];
    if (!st || Math.max(...active().map(p => p.x), G.p.x) < st.x - 3 * T) return; // só sobre chão firme, nunca cobrindo buracos
    label = 'DESAFIO ' + (G.cur + 1); q = st.q;
  } else {
    if (!G.boss || G.boss.dying || G.wait > 0) return;
    label = 'GOLPE ' + (G.boss.max - G.boss.hp + 1); q = PHASE2[G.bossQ[0]];
  }
  const text = q.q + (q.data() ? '  📋 dados no quadro' : '');
  const maxW = W - 150;
  let size = 17, lines;
  do { ctx.font = 'bold ' + size + 'px ' + FONT; lines = wrapLines(text, maxW); } while (lines.length > 2 && --size > 11);
  ctx.fillStyle = 'rgba(20, 12, 50, .88)'; ctx.fillRect(0, GY + 2, W, H - GY - 2);
  ctx.fillStyle = G.phase === 2 ? '#ef4444' : '#3b82f6'; rr(10, GY + 12, 112, 36, 8); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.font = 'bold 14px ' + FONT;
  ctx.fillText(label, 66, GY + 35);
  ctx.textAlign = 'left'; ctx.font = 'bold ' + size + 'px ' + FONT;
  const lh = size + 4, top = GY + 2 + (H - GY - 2 - lines.length * lh) / 2 + size - 2;
  lines.forEach((l, i) => ctx.fillText(l, 134, top + i * lh));
}

/* =========================================================
   TELAS
   ========================================================= */
function overlay(html, onGo) {
  $('modal').innerHTML = html;
  $('overlay').classList.remove('hidden');
  const btn = $('ovBtn');
  btn.addEventListener('click', () => { $('overlay').classList.add('hidden'); $('modal').innerHTML = ''; onGo(); });
  setTimeout(() => btn.focus(), 50);
}

function showStart() {
  overlay(
    '<span class="tag">Uma aventura de dados</span><h1>O Assistente Lendário</h1>' +
    '<div class="big">🧑‍💼📊</div>' +
    '<div class="story"><p>Você é o novo assistente administrativo da <b>Papelaria Horizonte</b>. O <b>Caos dos Dados</b> 👾 bagunçou as planilhas e soltou bugs <b>#REF!</b> pelo escritório. ' +
    'Resolva os desafios de dados (<b>Fase 1</b>) e derrote o chefão na sala dele (<b>Fase 2</b>)!</p></div>' +
    '<div class="rules">' +
    '<div class="rule"><b>⬆️</b>Pule por baixo e <strong>bata a cabeça</strong> no bloco com a resposta certa</div>' +
    '<div class="rule"><b>🔓</b>Cada acerto abre o portão para seguir</div>' +
    '<div class="rule"><b>❤️❤️❤️</b>Vidas do time. Errar, cair no buraco ou levar dano tira uma</div>' +
    '<div class="rule"><b>👟</b>Pule em cima dos bugs para derrotá-los (+50)</div>' +
    '</div>' +
    '<p class="keys-desk">Jogue sozinho ou em <b>dupla no mesmo teclado</b>. <kbd>P</kbd> pausa.</p>' +
    '<p class="keys-touch">Use os botões ◀ ▶ e PULAR abaixo do jogo.</p>' +
    '<button class="btn" id="ovBtn">▶ Escolher jogadores</button>',
    () => showSelect()
  );
}

// tela de seleção: 1 ou 2 jogadores e o personagem de cada um
function showSelect() {
  const touch = matchMedia('(hover: none) and (pointer: coarse)').matches;
  if (touch) SETUP.players = 1;
  const cards = i => CHARS.map((c, k) => '<button class="char" data-p="' + i + '" data-c="' + k + '"><canvas width="96" height="112"></canvas><span>' + c.name + '</span></button>').join('');
  overlay(
    '<span class="tag">Antes de começar</span><h1>Escolha os jogadores</h1>' +
    '<div class="modes"><button class="mode" data-m="1">👤 1 Jogador</button><button class="mode" data-m="2"' + (touch ? ' disabled title="Para jogar em dupla, use um teclado"' : '') + '>👥 2 Jogadores</button></div>' +
    '<div class="pick"><div class="pick-h"><span class="ptag" style="background:' + PCOLORS[0] + '">Jogador 1</span><small id="k1"></small></div><div class="chars">' + cards(0) + '</div></div>' +
    '<div class="pick" id="pick2"><div class="pick-h"><span class="ptag" style="background:' + PCOLORS[1] + '">Jogador 2</span><small><kbd>←</kbd> <kbd>→</kbd> andar, <kbd>↑</kbd> pular</small></div><div class="chars">' + cards(1) + '</div></div>' +
    '<p id="note2"></p>' +
    '<button class="btn" id="ovBtn">▶ Começar</button>',
    () => { newGame(); G.mode = 'play'; sfx.door(); }
  );
  document.querySelectorAll('.char canvas').forEach(cvs => {
    const c2 = cvs.getContext('2d'); c2.scale(2, 2);
    const old = ctx; ctx = c2;
    drawPlayerBody({ x: 9, y: 3, w: 30, h: 52, face: 1, vx: 0, on: true, ch: CHARS[+cvs.parentElement.dataset.c] });
    ctx = old;
  });
  const refresh = () => {
    document.querySelectorAll('.mode').forEach(b => b.classList.toggle('on', +b.dataset.m === SETUP.players));
    $('pick2').style.display = SETUP.players === 2 ? '' : 'none';
    $('k1').innerHTML = touch ? 'botões ◀ ▶ e PULAR' : SETUP.players === 2 ? '<kbd>A</kbd> <kbd>D</kbd> andar, <kbd>W</kbd> pular' : '<kbd>←</kbd> <kbd>→</kbd> andar, <kbd>↑</kbd> ou <kbd>Espaço</kbd> pular';
    $('note2').textContent = SETUP.players === 2 ? 'Os dois jogam juntos no mesmo teclado. Vidas (5) e pontos são do time.'
      : touch ? 'No celular dá para jogar com 1 jogador.' : 'Chame alguém e escolha 2 Jogadores para jogar em dupla!';
    document.querySelectorAll('.char').forEach(b => {
      const pi = +b.dataset.p, k = +b.dataset.c;
      b.style.setProperty('--pc', PCOLORS[pi]);
      b.classList.toggle('sel', SETUP.chars[pi] === k);
      b.classList.toggle('taken', SETUP.players === 2 && SETUP.chars[1 - pi] === k);
    });
  };
  document.querySelectorAll('.mode').forEach(b => b.addEventListener('click', () => { SETUP.players = +b.dataset.m; refresh(); }));
  document.querySelectorAll('.char').forEach(b => b.addEventListener('click', () => {
    const pi = +b.dataset.p, k = +b.dataset.c;
    if (SETUP.chars[1 - pi] === k) SETUP.chars[1 - pi] = SETUP.chars[pi]; // se o colega já tinha esse, os dois trocam
    SETUP.chars[pi] = k; refresh();
  }));
  refresh();
}

function bossIntro() {
  G.mode = 'menu'; sfx.door();
  overlay(
    '<span class="tag">Fase 2 • Chefão</span><h1>O Caos dos Dados</h1><div class="big">👾</div>' +
    '<p>Ele está flutuando pela sala e vai atirar <b>#ERRO!</b> em você. Leia a pergunta no quadro, desvie dos tiros e bata no bloco com a resposta certa para acertá-lo.</p>' +
    (G.gotStar ? '<p>🦡 <b>A Texuga veio te ajudar!</b> Ela fica perto de você e come alguns tiros #ERRO.</p>' : '') +
    '<p>São <b>' + PHASE2.length + ' golpes</b> para derrotá-lo. Cada pergunta tem <b>' + BOSS_TIME + ' segundos</b>, e responder rápido vale bônus!</p>' +
    '<button class="btn" id="ovBtn">⚔️ Enfrentar o chefão</button>',
    () => { buildBoss(); G.mode = 'play'; }
  );
}

function endGame(won) {
  G.mode = 'menu';
  const stats = '<div>✅ Acertos: ' + G.right + '</div><div>❌ Erros: ' + G.wrong + '</div><div>🪙 Moedas: ' + G.coinsN + '</div><div>👟 Bugs derrotados: ' + G.stomps + '</div>' + (G.gotStar ? '<div>🦡 Easter egg da Texuga!</div>' : '');
  if (won) {
    const bonus = G.lives * 200;
    G.score += bonus; renderHud();
    startConfetti(); playVictory();
    overlay(
      '<span class="tag">Missão cumprida</span><h1>' + (G.ps.length > 1 ? 'Vocês são os Assistentes Lendários!' : 'Você é o Assistente Lendário!') + '</h1><div class="big">🏆</div>' +
      '<p>O Caos dos Dados foi derrotado, as planilhas estão em ordem e o relatório foi entregue no prazo.</p>' +
      '<div class="final">' + G.score + ' pts</div><div class="stats">' + stats + '<div>❤️ Bônus de vidas: +' + bonus + '</div></div>' +
      '<button class="btn" id="ovBtn">🔁 Jogar de novo</button><button class="btn2" id="swapBtn">👥 Trocar jogadores</button>',
      () => { stopConfetti(); newGame(); G.mode = 'play'; }
    );
    $('swapBtn').addEventListener('click', () => { stopConfetti(); showSelect(); });
  } else {
    overlay(
      '<span class="tag">Game over</span><h1>O Caos venceu desta vez...</h1><div class="big">💀</div>' +
      '<p>Suas vidas acabaram. Leia as explicações no quadro e tente de novo: todo assistente lendário já errou uma planilha!</p>' +
      '<div class="final">' + G.score + ' pts</div><div class="stats">' + stats + '</div>' +
      '<button class="btn" id="ovBtn">🔁 Tentar novamente</button><button class="btn2" id="swapBtn">👥 Trocar jogadores</button>',
      () => { newGame(); G.mode = 'play'; }
    );
    $('swapBtn').addEventListener('click', () => showSelect());
  }
}

/* =========================================================
   CONFETES
   ========================================================= */
const cc = $('confetti'), cx = cc.getContext('2d');
let pieces = [], confettiOn = false;
function startConfetti() {
  cc.width = innerWidth; cc.height = innerHeight;
  const colors = ['#ff3d7f', '#ffd23f', '#22c55e', '#3b82f6', '#8b5cf6', '#ff8c42'];
  pieces = Array.from({ length: 180 }, () => ({
    x: Math.random() * cc.width, y: Math.random() * -cc.height, w: rand(6, 14), h: rand(8, 18),
    vy: rand(2, 6), vx: rand(-1.5, 1.5), r: Math.random() * 3, vr: rand(-.2, .2), c: colors[Math.floor(Math.random() * 6)]
  }));
  if (!confettiOn) { confettiOn = true; requestAnimationFrame(drawConfetti); }
}
function drawConfetti() {
  cx.clearRect(0, 0, cc.width, cc.height);
  if (!confettiOn) return;
  for (const p of pieces) {
    p.x += p.vx; p.y += p.vy; p.r += p.vr;
    if (p.y > cc.height) { p.y = -20; p.x = Math.random() * cc.width; }
    cx.save(); cx.translate(p.x, p.y); cx.rotate(p.r); cx.fillStyle = p.c; cx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); cx.restore();
  }
  requestAnimationFrame(drawConfetti);
}
function stopConfetti() { confettiOn = false; }

/* =========================================================
   LOOP PRINCIPAL
   ========================================================= */
$('muteBtn').addEventListener('click', e => { muted = !muted; e.currentTarget.textContent = muted ? '🔇' : '🔊'; e.currentTarget.blur(); });
addEventListener('resize', () => { fitCanvas(); if (confettiOn) { cc.width = innerWidth; cc.height = innerHeight; } });

let last = 0, acc = 0;
const STEP = 1000 / 60;
function loop(t) {
  requestAnimationFrame(loop);
  if (!last) last = t;
  acc += Math.min(100, t - last); last = t;
  while (acc >= STEP) { update(); acc -= STEP; }
  musicTick(t);
  render();
}

newGame(); G.mode = 'menu';
$('cTitle').textContent = 'Quadro da missão';
$('cQ').textContent = 'As perguntas aparecem aqui durante o jogo.';
$('cData').innerHTML = ''; $('cHint').textContent = 'Fique de olho neste quadro: é nele que estão os dados de cada desafio.';
showStart();
requestAnimationFrame(loop);
</script>
